<svg xmlns="http://www.w3.org/2000/svg" width="880" height="50" viewBox="0 0 880 50" role="img" aria-label="cd ~/deployments &amp;&amp; ls">
<defs>
  <style>
text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 13px; fill: #cbd5e1; white-space: pre; }
.dim { fill: #64748b; } .cy { fill: #22d3ee; } .deep { fill: #0e7490; } .ok { fill: #22c55e; font-weight: 700; }
.warn { fill: #f59e0b; font-weight: 700; } .red { fill: #ef4444; } .vi { fill: #a78bfa; }
.b { fill: #f1f5f9; font-weight: 700; } .prompt { fill: #22d3ee; font-weight: 700; }
.title { fill: #64748b; font-size: 12px; } .big { fill: #f1f5f9; font-size: 17px; font-weight: 700; }
</style>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
  <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
  <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
    <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x=".5" y=".5" width="879" height="49" rx="14" fill="#0a0e14" stroke="#1e293b"/>
<text x="22" y="30" class="prompt" opacity="0">$<set attributeName="opacity" to="1" begin="0.15s" fill="freeze"/></text>
<clipPath id="d"><rect x="38" y="16" width="0" height="20"><animate attributeName="width" values="0.0;7.8;15.6;23.4;31.2;39.0;46.8;54.6;62.4;70.2;78.0;85.8;93.6;101.4;109.2;117.0;124.8;132.6;140.4;148.2;156.0;163.8;171.6" begin="0.20s" dur="0.55s" calcMode="discrete" fill="freeze"/></rect></clipPath><text x="38" y="30" clip-path="url(#d)">cd ~/deployments &amp;&amp; ls</text>
<text x="233.0" y="30" class="dim" opacity="0"># web, backend &amp; infrastructure<set attributeName="opacity" to="1" begin="0.75s" fill="freeze"/></text>
<rect x="1" y="1" width="878" height="48" fill="url(#scan)"/><rect x="1" y="1" width="878" height="48" rx="14" fill="url(#vignette)"/></svg>