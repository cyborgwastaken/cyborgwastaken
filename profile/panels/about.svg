<text x="36" y="92" opacity="0">I keep production boring so the product can be exciting.<set attributeName="opacity" to="1" begin="0.67s" fill="freeze"/></text>
<text x="36" y="114" opacity="0">By day I build observability and reliability tooling for a live cybersecurity GRC platform<set attributeName="opacity" to="1" begin="0.74s" fill="freeze"/></text>
<text x="36" y="136" opacity="0">at Cyberpal.ai. After hours I run Arx Studios, where I write compilers, ship web products<set attributeName="opacity" to="1" begin="0.81s" fill="freeze"/></text>
<text x="36" y="158" opacity="0">and build games.<set attributeName="opacity" to="1" begin="0.89s" fill="freeze"/></text>
