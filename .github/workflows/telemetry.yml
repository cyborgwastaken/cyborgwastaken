name: Profile telemetry

on:
  schedule:
    - cron: "17 0 * * *" # daily, ~05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile/telemetry/build.py", ".github/workflows/telemetry.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render telemetry.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python profile/telemetry/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/telemetry/telemetry.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "telemetry: daily refresh [skip ci]"
          git pull --rebase --quiet
          git push
