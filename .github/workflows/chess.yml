name: Chess

on:
  issues:
    types: [opened]

# one move at a time: queued issues are processed in order against the latest board
concurrency:
  group: chess
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish and python-chess
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          pip install --quiet python-chess==1.11.2

      - name: Play the move
        env:
          # untrusted input: passed via env, never interpolated into the script
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: python profile/chess/game.py issue

      - name: Commit the new position
        run: |
          git config user.name "arx-chess-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/chess
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chess: @${{ github.event.issue.user.login }} moved (#${{ github.event.issue.number }}) [skip ci]"
          git pull --rebase --quiet
          git push

      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"; fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
